<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Farbverlauf im Stil des Instagram-Logos: Gelb unten links → Orange → Pink → Violett/Blau oben -->
    <radialGradient id="warm" cx="0.26" cy="1.08" r="1.25">
      <stop offset="0" stop-color="#fdf497"/>
      <stop offset="0.07" stop-color="#fdf497"/>
      <stop offset="0.42" stop-color="#fd5949"/>
      <stop offset="0.62" stop-color="#d6249f"/>
      <stop offset="0.95" stop-color="#5b3fd9"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.12" cy="0.02" r="0.55">
      <stop offset="0" stop-color="#3771c8"/>
      <stop offset="0.6" stop-color="#6633cc" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6600ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#warm)"/>
  <rect width="512" height="512" fill="url(#cool)"/>
  <rect width="512" height="512" fill="url(#gloss)"/>

  <!-- Tagebuch: Einband, Buchrücken, Lesebändchen und kleines Haus auf dem Cover -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="132" y="92" width="248" height="328" rx="62" stroke-width="32"/>
    <path d="M204 108v296" stroke-width="26"/>
    <path d="M254 270l46-38 46 38v44a10 10 0 0 1-10 10h-72a10 10 0 0 1-10-10z" stroke-width="22"/>
  </g>
  <path d="M314 76h46v96l-23-18-23 18z" fill="#fff"/>
</svg>
