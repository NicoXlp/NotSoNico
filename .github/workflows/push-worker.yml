name: Sofort-Push veröffentlichen (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['push-worker/**', 'js/trash-logic.js']
  workflow_dispatch:

jobs:
  deploy:
    # Läuft erst, wenn unter Settings → Secrets and variables → Actions → Variables
    # die Variable WORKER_ENABLED = true angelegt ist.
    if: ${{ vars.WORKER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: push-worker
          command: deploy
          secrets: |
            VAPID_PRIVATE_KEY
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Gesundheitscheck
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -s --max-time 10 https://vermietertagebuch-push.niccoseiddel-2001.workers.dev/ || true)
            echo "Antwort: $out"
            echo "$out" | grep -q '"ok":true' && break
            sleep 5
          done
          echo "$out" | grep -q '"ok":true'
          echo "CORS-Vorabfrage:"
          curl -s -o /dev/null -D - -X OPTIONS -H "Origin: https://nicoxlp.github.io" -H "Access-Control-Request-Method: POST" https://vermietertagebuch-push.niccoseiddel-2001.workers.dev/notify | grep -i "^HTTP\|access-control-allow-origin"
          echo "Ohne gültige Anmeldung (soll 401 sein):"
          curl -s -w " HTTP %{http_code}\n" -X POST -H "Content-Type: application/json" -H "Authorization: Bearer test" -d '{"hid":"XXXXX-XXXXX","event":{"title":"x","actor":"y"}}' https://vermietertagebuch-push.niccoseiddel-2001.workers.dev/notify
