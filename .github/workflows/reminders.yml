name: Mitteilungen

on:
  schedule:
    - cron: '*/5 * * * *'   # alle 5 Minuten (GitHub startet geplante Läufe manchmal etwas später)
  workflow_dispatch:
    inputs:
      test:
        description: 'Test-Mitteilung an alle Geräte mit eingeschalteten Erinnerungen schicken'
        type: boolean
        default: false

concurrency:
  group: mitteilungen
  cancel-in-progress: false

jobs:
  send:
    # Läuft erst, wenn unter Settings → Secrets and variables → Actions → Variables
    # die Variable PUSH_ENABLED = true angelegt ist (spart sonst Actions-Minuten).
    if: ${{ vars.PUSH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_TEST: ${{ inputs.test && '1' || '' }}
