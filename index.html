<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vermietertagebuch</title>
  <meta name="description" content="Die App für eure Hausgemeinschaft: Aufgaben, Müllabfuhr, Social Hub, Umfragen und Ereignisse.">
  <meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vermietertagebuch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="css/style.css?v=60">
</head>
<body>
  <!-- Startanimation: Kalender-Tagebuch (steht direkt im HTML, damit sie sofort erscheint) -->
  <div class="splash" id="splash" aria-hidden="true">
    <span class="sp-blob sp-b1"></span><span class="sp-blob sp-b2"></span><span class="sp-blob sp-b3"></span>
    <div class="sp-card">
      <div class="sp-rings"><i></i><i></i></div>
      <div class="sp-head"><span id="sp-month">November</span><span id="sp-wd">Freitag</span></div>
      <div class="sp-day">
        <div class="sp-num sp-today" id="sp-today">13</div>
        <div class="sp-num sp-old" id="sp-old">12</div>
      </div>
      <div class="sp-lines"><i></i><i></i><i></i></div>
      <span class="sp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </div>
  </div>
  <script>
    // Sofort (vor dem ersten Bild): echtes Datum, Hell/Dunkel und Farbschema der App übernehmen
    (function () {
      try {
        var d = new Date(), y = new Date(d.getTime() - 864e5);
        document.getElementById('sp-month').textContent = d.toLocaleDateString('de-DE', { month: 'long' });
        document.getElementById('sp-wd').textContent = d.toLocaleDateString('de-DE', { weekday: 'long' });
        document.getElementById('sp-today').textContent = d.getDate();
        document.getElementById('sp-old').textContent = y.getDate();
        var t = JSON.parse(localStorage.getItem('vt.theme') || '"auto"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var c = JSON.parse(localStorage.getItem('vt.splash') || 'null');
        if (c) {
          var s = document.documentElement.style;
          s.setProperty('--sp-accent', c.accent); s.setProperty('--sp-on', c.fg);
          (c.blobs || []).forEach(function (b, i) { s.setProperty('--sp-b' + (i + 1), b); });
        }
      } catch (e) { /* Standardfarben */ }
    })();
  </script>
  <!-- Farbiger, sanft bewegter Hintergrund – damit das Glas etwas zum Brechen hat -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <!-- SVG-Filter für die Lichtbrechung der Liquid-Glass-Linse (nur Chromium unterstützt das als backdrop-filter) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main id="app">
    <div id="view" class="view"></div>
  </main>

  <div class="dock" id="dock" hidden>
    <nav class="tabbar glass" id="tabbar" aria-label="Navigation">
      <div class="lens" id="lens" aria-hidden="true"><div class="lens-glass"></div></div>
    </nav>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=60"></script>
</body>
</html>
